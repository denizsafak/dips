name: Build Windows Single Executable

on:
  workflow_dispatch:

jobs:
  build-windows-onefile:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv -e ".[dev]"

      - name: Download AI models
        shell: bash
        run: .venv/Scripts/python.exe scripts/download_models.py

      - name: Run unit and UI smoke tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv/Scripts/pytest.exe -v

      - name: Build Windows single-file executable
        shell: bash
        run: .venv/Scripts/python.exe scripts/build.py --onefile

      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: dips-windows-onefile
          path: dist/DIPS.exe
