name: Build & Publish DIPS Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: "Publish as draft GitHub release"
        required: false
        type: boolean
        default: true
      prerelease:
        description: "Mark release as prerelease"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  DIST_DIR: /tmp/dips-builds

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            file_name: windows_amd64
          - os: macos-latest
            file_name: macos_arm64
          - os: macos-15-intel
            file_name: macos_amd64

    runs-on: ${{ matrix.os }}

    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv -e ".[dev]"

      - name: Download AI models
        shell: bash
        run: |
          if [ -f .venv/Scripts/python.exe ]; then
            .venv/Scripts/python.exe scripts/download_models.py
          else
            .venv/bin/python scripts/download_models.py
          fi

      - name: Run unit and UI smoke tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ -f .venv/Scripts/pytest.exe ]; then
            .venv/Scripts/pytest.exe -v
          else
            .venv/bin/pytest -v
          fi

      - name: Extract app version
        id: meta
        shell: bash
        run: |
          ver=$(python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])' || python3 -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Build & package application
        shell: bash
        run: |
          if [ -f .venv/Scripts/python.exe ]; then
            .venv/Scripts/python.exe scripts/build.py
          else
            .venv/bin/python scripts/build.py
          fi

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.file_name }}
          path: |
            DIPS-*.zip

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Linux AppImage, Debian .deb, and tarball in Docker
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace \
            --env DEBIAN_FRONTEND=noninteractive \
            --env TZ=Etc/UTC \
            --privileged \
            --entrypoint bash \
            python:3.12-slim \
            -c "apt-get update && \
                apt-get install -y --no-install-recommends \
                  binutils file fuse libfuse2 libfontconfig1 libfreetype6 libglib2.0-0 libgl1 libegl1 libdrm2 \
                  libxkbcommon-x11-0 libxcb-xinerama0 libxcb-cursor0 libxcb-icccm4 \
                  libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
                  libxcb-shape0 libxcb-xfixes0 libxcb-xkb1 libxrender1 libsm6 \
                  libxext6 libx11-xcb1 libdbus-1-3 libwayland-client0 libwayland-egl1 && \
                pip install --no-cache-dir uv && \
                uv venv .venv && \
                uv pip install --python .venv -e '.[dev]' && \
                .venv/bin/python scripts/download_models.py && \
                QT_QPA_PLATFORM=offscreen .venv/bin/pytest -v && \
                .venv/bin/python scripts/build.py"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-linux_amd64
          path: |
            DIPS-*.AppImage
            DIPS-*.deb
            DIPS-*.tar.gz

  release:
    needs: [build, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ env.DIST_DIR }}
          pattern: build-artifacts-*
          merge-multiple: true

      - name: Read CHANGELOG
        run: |
          {
            echo "changelog<<EOF"
            cat CHANGELOG.md
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Collect commits
        run: |
          cur_tag="v${{ needs.build.outputs.version }}"
          prev_tag=$(git describe --tags --abbrev=0 --exclude "$cur_tag" 2>/dev/null || true)
          if [ -n "$prev_tag" ]; then
            commits=$(git log "${prev_tag}..HEAD" --pretty=format:"* %s (%h)")
          else
            commits=$(git log --pretty=format:"* %s (%h)")
          fi
          if [ -z "$commits" ]; then
            commits="* Initial release"
          fi
          {
            echo "COMMITS<<EOF"
            echo "$commits"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.build.outputs.version }}"
          name: "DIPS v${{ needs.build.outputs.version }}"
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          overwrite: true
          generate_release_notes: true
          files: ${{ env.DIST_DIR }}/*
          body: |
            ### Downloads
            * **Windows (x64):** [DIPS-windows-amd64.zip](https://github.com/${{ github.repository }}/releases/download/v${{ needs.build.outputs.version }}/DIPS-windows-amd64.zip)
            * **macOS (Apple Silicon):** [DIPS-macos-arm64.zip](https://github.com/${{ github.repository }}/releases/download/v${{ needs.build.outputs.version }}/DIPS-macos-arm64.zip)
            * **macOS (Intel):** [DIPS-macos-amd64.zip](https://github.com/${{ github.repository }}/releases/download/v${{ needs.build.outputs.version }}/DIPS-macos-amd64.zip)
            * **Linux (AppImage):** [DIPS-linux-amd64.AppImage](https://github.com/${{ github.repository }}/releases/download/v${{ needs.build.outputs.version }}/DIPS-linux-amd64.AppImage)
            * **Linux (Debian / Ubuntu / Mint):** [DIPS-linux-amd64.deb](https://github.com/${{ github.repository }}/releases/download/v${{ needs.build.outputs.version }}/DIPS-linux-amd64.deb)
            * **Linux (Tarball):** [DIPS-linux-amd64.tar.gz](https://github.com/${{ github.repository }}/releases/download/v${{ needs.build.outputs.version }}/DIPS-linux-amd64.tar.gz)

            ### Commits
            ${{ env.COMMITS }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
